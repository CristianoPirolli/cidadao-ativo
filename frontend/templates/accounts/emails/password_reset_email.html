<html>
  <body style="font-family: Arial, sans-serif; line-height: 1.6; color: #334155;">
    <div style="max-width: 600px; margin: 0 auto; padding: 20px;">
      <h2 style="color: #1557c0;">Crie uma nova senha</h2>
      <p>Olá, <strong>{{ user.name }}</strong>!</p>
      <p>Recebemos um pedido para criar uma nova senha na sua conta do <strong>Cidadão Ativo</strong>.</p>
      <p style="margin: 28px 0;">
        <a href="{{ protocol }}://{{ domain }}{% url 'password_reset_confirm' uidb64=uid token=token %}"
           style="background: #1f6feb; color: #ffffff; padding: 12px 24px; border-radius: 8px; text-decoration: none; font-weight: bold;">
          Criar nova senha
        </a>
      </p>
      <p style="font-size: 14px;">O link vale por 2 horas e só pode ser usado uma vez.</p>
      <p style="font-size: 14px; color: #475569;">Se você não fez esse pedido, ignore este e-mail: sua senha continua a mesma.</p>
    </div>
  </body>
</html>
