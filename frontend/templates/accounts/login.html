{% extends 'base.html' %}
{% block title %}Entrar · Cidadão Ativo{% endblock %}
{% block content %}
<div class="auth-card">
  <div class="glass-card">
    <h1 class="h3 fw-bold mb-1">Entrar</h1>
    <p class="text-muted mb-4">Cidadãos entram com o CPF. Órgãos públicos e administradores, com o e-mail.</p>

    <form method="POST" action="{% url 'login' %}{% if request.GET.next %}?next={{ request.GET.next|urlencode }}{% endif %}" novalidate>
      {% csrf_token %}
      <div class="mb-3">
        <label for="login_id" class="form-label">CPF ou e-mail</label>
        <input type="text" class="form-control form-control-lg" id="login_id" name="login_id"
               autocomplete="username" autocapitalize="none" spellcheck="false"
               aria-describedby="login_id_help" required autofocus
               value="{{ request.POST.login_id|default:'' }}">
        <div id="login_id_help" class="form-text">Ex.: 123.456.789-00 ou nome@prefeitura.gov.br</div>
      </div>

      <div class="mb-4">
        <label for="password" class="form-label">Senha</label>
        <div class="input-group">
          <input type="password" class="form-control form-control-lg" id="password" name="password"
                 autocomplete="current-password" required>
          <button class="btn btn-outline-secondary" type="button" data-toggle-password="password"
                  aria-label="Mostrar senha" aria-pressed="false">
            <i class="bi bi-eye" aria-hidden="true"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-lg w-100">Entrar</button>
    </form>

    <p class="text-center mt-4 mb-0">
      Ainda não tem conta? <a href="{% url 'register' %}" class="fw-semibold">Criar conta</a>
    </p>
  </div>
</div>
{% endblock %}
