{% extends 'base.html' %}
{% block title %}Sem conexão · Cidadão Ativo{% endblock %}
{% block content %}
<div class="auth-card">
  <div class="card">
    <div class="card-body text-center py-5">
      <i class="bi bi-wifi-off display-5 text-muted" aria-hidden="true"></i>
      <h1 class="h4 mt-3">Você está sem internet</h1>
      <p>Esta página precisa de conexão para mostrar informações atualizadas.</p>
      <p class="text-muted small">Se você estava registrando um chamado, o rascunho continua guardado neste aparelho.</p>
      <button type="button" class="btn btn-primary" onclick="window.location.reload()">
        <i class="bi bi-arrow-clockwise" aria-hidden="true"></i> Tentar de novo
      </button>
    </div>
  </div>
</div>
{% endblock %}
