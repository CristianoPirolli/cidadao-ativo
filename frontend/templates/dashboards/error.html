{% extends 'base.html' %}
{% block title %}Painel indisponível · Cidadão Ativo{% endblock %}
{% block content %}
<div class="auth-card">
  <div class="card">
    <div class="card-body text-center py-5">
      <i class="bi bi-exclamation-triangle text-warning display-5" aria-hidden="true"></i>
      <h1 class="h4 mt-3">Não foi possível abrir o painel</h1>
      <p>{{ error }}</p>
      <p class="text-muted small">Fale com o administrador da plataforma para completar seu cadastro.</p>
      <a href="{% url 'logout' %}" class="btn btn-outline-secondary">Sair</a>
    </div>
  </div>
</div>
{% endblock %}
