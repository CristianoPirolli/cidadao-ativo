# Stack completa: PostgreSQL + Django (Gunicorn) + Nginx
#   docker compose up -d --build
# Acesse em http://localhost:${APP_PORT:-8000}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cidadao_ativo}
      POSTGRES_USER: ${POSTGRES_USER:-cidadao_ativo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    image: cidadao-ativo-backend
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    volumes:
      - static_data:/vol/static
      - media_data:/vol/media
      - app_data:/vol/data
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/vol/static:ro
      - media_data:/vol/media:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  static_data:
  media_data:
  app_data:
