services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cidadao_ativo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Sobrescreve o .env para apontar para o serviço 'db' interno
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: cidadao_ativo
      DB_USER: postgres
      DB_PASSWORD: postgres
      DJANGO_DEBUG: "false"
      CSRF_TRUSTED_ORIGINS: "http://localhost:8000,http://127.0.0.1:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/app/app/uploads
      - logs_data:/app/logs

volumes:
  postgres_data:
  uploads_data:
  logs_data:
