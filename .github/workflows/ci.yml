name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cidadao_ativo
          POSTGRES_USER: cidadao_ativo
          POSTGRES_PASSWORD: cidadao_ativo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cidadao_ativo"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PASSWORD: cidadao_ativo
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - run: pip install -r requirements/dev.txt
      - name: Lint
        run: ruff check .
      - name: Migrações pendentes
        run: python manage.py makemigrations --check --dry-run
      - name: Testes
        run: pytest --cov --cov-report=term-missing

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build da imagem
        run: docker build -f docker/backend/Dockerfile -t cidadao-ativo-backend .
